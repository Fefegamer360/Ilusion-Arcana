</style></head><body>
<div id="app"></div>
<button id="fab" class="gl" aria-label="Herramientas">✦</button>
<div id="tools" hidden><div class="gl">
<h4>Dados</h4><div class="cg" id="dice"></div>
<canvas id="cv"></canvas><div id="res"></div>
<div class="cg"><button data-a="coin">🪙 Moneda</button><button data-a="start">🎲 ¿Quién empieza?</button></div>
<div class="cg"><button data-a="reset">↺ Reiniciar vidas</button><button data-a="new">⚙ Nueva partida</button></div>
<button data-a="cfg">⚙ Ajustes</button><button data-a="close">Cerrar</button></div></div>
<div id="setup" hidden></div><div id="cfg" hidden></div><div id="bn" class="gl"></div><div id="tt" class="gl"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='mtg_state',KP='mtg_profiles';
const GAL=[['Blanco','radial-gradient(circle at 30% 20%,#fffdf0,#e8dcae 50%,#a89868)'],['Azul','radial-gradient(circle at 70% 20%,#7fd0ff,#1e63c8 55%,#0a2150)'],['Negro','radial-gradient(circle at 50% 10%,#7a6a8a,#241a2e 55%,#07050a)'],['Rojo','radial-gradient(circle at 30% 80%,#ffa05a,#d1301c 50%,#4a0a0a)'],['Verde','radial-gradient(circle at 60% 30%,#aaea80,#2c8a3c 55%,#0b3318)'],['Azorius','linear-gradient(135deg,#f3ecc8,#4c8fe0 60%,#16346e)'],['Rakdos','linear-gradient(135deg,#2a1230,#c4281c)'],['Selesnya','linear-gradient(135deg,#f1efc4,#3d9a4a)'],['Dimir','linear-gradient(135deg,#1c4fa8,#140b22)'],['Gruul','linear-gradient(135deg,#d9402a,#2f8a3a)']];
let S=null,PR=[];try{S=JSON.parse(localStorage[K])}catch(e){}try{PR=JSON.parse(localStorage[KP])||[]}catch(e){}
S=S||{started:0,life0:40,n:4,lay:'rows',players:[],ord:{},mon:null,ini:null};
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>{try{localStorage[K]=ser()}catch(e){toast('Almacenamiento lleno: usa una imagen más pequeña')}},150)};
const savePr=()=>{try{localStorage[KP]=JSON.stringify(PR)}catch(e){toast('Perfil demasiado grande para guardar')}};
function toast(m){const t=$('#tt');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2500)}
const alive=()=>S.players.filter(p=>!p.dead),updAll=()=>S.players.forEach(upd);
function newGame(){const o=S.players;S.players=[...Array(S.n)].map((_,i)=>({id:i,name:o[i]?.name||'Jugador '+(i+1),bg:o[i]?.bg||GAL[i%5][1],life:S.life0,poison:0,energy:0,exp:0,rad:0,tix:0,cmd:{},dead:0}));S.mon=S.ini=null;S.ord={};S.started=1;save();layout()}
function layout(){const app=$('#app');app.innerHTML='';const al=alive(),n=al.length,cols=S.lay==='cols'&&n>1;if(!n){S.started=0;save();return setup()}app.className=cols?'cols':'rows';
 const k=Math.ceil(n/2),g=(n>1?[al.slice(0,k),al.slice(k)]:[al]).filter(x=>x.length);
 g.forEach((a,gi)=>{const d=document.createElement('div');d.className='grp';let list=a,rot=0;
  if(gi&&n>1)list=[...a].reverse();
  if(n>1&&S.lay==='rows')rot=gi?0:180;if(cols){rot=gi?90:-90;d.style.order=gi?0:1}
  list.forEach(p=>d.append(mk(p,rot)));app.append(d)});
 updAll();if(S.started&&n===1&&S.players.length>1)win(al[0])}

  c.fillStyle='#0000004d';c.beginPath();c.ellipse(cx,h*.9,r*.8,r*.12,0,0,7);c.fill();
  c.fillStyle='#8a6a14';c.beginPath();c.ellipse(cx,cy+th,r,ry,0,0,7);c.fill();c.fillRect(cx-r,cy,2*r,th);
  c.fillStyle=cs>=0?'#f5c542':'#e0b030';c.beginPath();c.ellipse(cx,cy,r,ry,0,0,7);c.fill();c.strokeStyle='#fff6';c.lineWidth=2;c.stroke();
  c.save();c.translate(cx,cy);c.scale(1,Math.abs(cs));c.fillStyle='#7a5a08';c.font=`700 ${r*1.1}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(cs>=0?'♛':'✚',0,0);c.restore()},LITE?800:1300,()=>{$('#res').textContent=res?'Cruz':'Cara'})}
// --- mando
const gce=document.createElement('div');gce.id='gc';gce.hidden=true;document.body.append(gce);
let gc={x:innerWidth/2,y:innerHeight/2},gP=[],gD=null,gT=0,gOn=0;
const gev=(t,el)=>el.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:gc.x,clientY:gc.y,pointerId:99,isPrimary:true,pointerType:'mouse'}));
function gLoop(t){requestAnimationFrame(gLoop);const g=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);if(!g){if(gOn){gOn=0;gce.hidden=true}return}
 if(!gOn){gOn=1;gce.hidden=false}const dt=Math.min(.05,(t-gT)/1000||0);gT=t;const ax=v=>Math.abs(v)<.15?0:v*Math.abs(v),sp=Math.max(innerWidth,innerHeight)*.9*dt;
 gc.x=Math.max(0,Math.min(innerWidth-1,gc.x+ax(g.axes[0]||0)*sp));gc.y=Math.max(0,Math.min(innerHeight-1,gc.y+ax(g.axes[1]||0)*sp));gce.style.transform=`translate(${gc.x}px,${gc.y}px)`;
 const B=g.buttons.map(b=>b.pressed),e=i=>B[i]&&!gP[i],u=i=>!B[i]&&gP[i],el=document.elementFromPoint(gc.x,gc.y);
 if(e(0)&&el){gD=el;gev('pointerdown',el);if(el.matches('input'))el.focus()}
 if(u(0)&&gD){gev('pointerup',gD);if(el)el.click();gD=null}
 if(e(1)){if(!$('#cfg').hidden)$('#cfg').hidden=true;else if(!$('#tools').hidden)tools(0);else $$('.md,.dr').pop()?.remove()}
 if(e(2)||e(9))tools($('#tools').hidden);
 const pe=el?.closest('.p'),pl=pe&&S.players[+pe.id.slice(1)];if(pl&&!pl.dead){if(e(4))adj(pl,-1);if(e(5))adj(pl,1);if(e(6))adj(pl,-5);if(e(7))adj(pl,5)}
 const sc=el?.closest('.dr,.md,#tools>div,#cfg>div,#setup>div');if(sc)sc.scrollTop+=ax(g.axes[3]||0)*dt*900;gP=B}
requestAnimationFrame(gLoop);
applyCfg();
if(S.started&&S.players.length)layout();else setup();
</script></body></html>
